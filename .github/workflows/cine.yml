name: Cine - CI y CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas
        run: python -m unittest discover -v
      - name: Validar CSV y generar informe
        run: python analizar.py
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Guardar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4